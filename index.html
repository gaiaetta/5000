<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Grand Prix Scoreboard</title>
  <style>
    :root {
      --bg-color: #0f1015;
      --card-bg: #1a1c23;
      --accent-red: #e10600;
      --text-main: #ffffff;
      --text-muted: #a0a5b5;
      --border-color: #2a2d37;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 24px;
      font-size: 1.5rem;
      border-bottom: 3px solid var(--accent-red);
      padding-bottom: 8px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    input, select, button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0f1015;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-red);
    }

    button.btn-add {
      background-color: var(--accent-red);
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    button.btn-add:hover {
      opacity: 0.9;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-red);
    }

    .standings-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .standing-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--card-bg);
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
    }

    .rank {
      font-weight: bold;
      font-size: 1.1rem;
      width: 30px;
      color: var(--accent-red);
    }

    .driver-name {
      flex: 1;
      font-weight: 600;
    }

    .points {
      font-weight: bold;
      font-size: 1.1rem;
      background: #252833;
      padding: 4px 12px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏆 Classifica F1</h1>

    <!-- Form Inserimento Risultati -->
    <div class="card">
      <div class="form-group">
        <label for="driverSelect">Pilota</label>
        <select id="driverSelect">
          <option value="Max Verstappen">Max Verstappen</option>
          <option value="Charles Leclerc">Charles Leclerc</option>
          <option value="Lando Norris">Lando Norris</option>
          <option value="Lewis Hamilton">Lewis Hamilton</option>
          <option value="Oscar Piastri">Oscar Piastri</option>
          <option value="Carlos Sainz">Carlos Sainz</option>
          <option value="George Russell">George Russell</option>
        </select>

        <label for="positionSelect">Posizione Arrivo Gara</label>
        <select id="positionSelect">
          <option value="1">1° Posto (25 pt)</option>
          <option value="2">2° Posto (18 pt)</option>
          <option value="3">3° Posto (15 pt)</option>
          <option value="4">4° Posto (12 pt)</option>
          <option value="5">5° Posto (10 pt)</option>
          <option value="6">6° Posto (8 pt)</option>
          <option value="7">7° Posto (6 pt)</option>
          <option value="8">8° Posto (4 pt)</option>
          <option value="9">9° Posto (2 pt)</option>
          <option value="10">10° Posto (1 pt)</option>
          <option value="11">Fuori dai primi 10 (0 pt)</option>
        </select>

        <label class="checkbox-group">
          <input type="checkbox" id="fastestLapCheck">
          <span>Giro Più Veloce (+1 pt se in top 10)</span>
        </label>

        <button class="btn-add" onclick="addPoints()">Aggiungi Punti</button>
      </div>
    </div>

    <!-- Classifica Generale -->
    <div class="card">
      <ul class="standings-list" id="standingsList">
        <!-- Generato dinamicamente con JS -->
      </ul>
    </div>
  </div>

  <script>
    // Tabella Punti F1 Standard
    const f1PointsTable = {
      1: 25, 2: 18, 3: 15, 4: 12, 5: 10,
      6: 8,  7: 6,  8: 4,  9: 2,  10: 1
    };

    // Inizializzazione Dati (o da localStorage)
    let drivers = JSON.parse(localStorage.getItem('f1_standings')) || [
      { name: 'Max Verstappen', points: 0 },
      { name: 'Charles Leclerc', points: 0 },
      { name: 'Lando Norris', points: 0 },
      { name: 'Lewis Hamilton', points: 0 },
      { name: 'Oscar Piastri', points: 0 },
      { name: 'Carlos Sainz', points: 0 },
      { name: 'George Russell', points: 0 }
    ];

    function renderStandings() {
      // Ordina per punti decrescenti
      drivers.sort((a, b) => b.points - a.points);

      const listEl = document.getElementById('standingsList');
      listEl.innerHTML = '';

      drivers.forEach((driver, index) => {
        const li = document.createElement('li');
        li.className = 'standing-item';
        li.innerHTML = `
          <span class="rank">${index + 1}</span>
          <span class="driver-name">${driver.name}</span>
          <span class="points">${driver.points} PTS</span>
        `;
        listEl.appendChild(li);
      });

      // Salva nei dati locali
      localStorage.setItem('f1_standings', JSON.stringify(drivers));
    }

    function addPoints() {
      const selectedName = document.getElementById('driverSelect').value;
      const position = parseInt(document.getElementById('positionSelect').value);
      const hasFastestLap = document.getElementById('fastestLapCheck').checked;

      let pts = f1PointsTable[position] || 0;

      // Giro veloce assegna 1 pt solo se il pilota finisce nei primi 10
      if (hasFastestLap && position <= 10) {
        pts += 1;
      }

      const driver = drivers.find(d => d.name === selectedName);
      if (driver) {
        driver.points += pts;
        renderStandings();
        // Reset checkbox
        document.getElementById('fastestLapCheck').checked = false;
      }
    }

    // Primo render all'avvio
    renderStandings();
  </script>
</body>
</html>
